<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GIGIRO RULETA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🎰 GIGIRO RULETA</h1>
  <p id="mensaje" role="status" aria-live="polite">Selecciona BET o Modo Manual para comenzar.</p>
  <div id="modos">
    <button id="modoBET" type="button" aria-pressed="false">🎯 BET</button>
    <button id="modoManual" type="button" aria-pressed="false">✋ Modo Manual</button>
  </div>
  <div id="ruleta" aria-label="Cilindro de ruleta americana"></div>
  <button id="limpiar" type="button">Borrar todo</button>
  <script src="script.js"></script>
</body>
</html>
